name: image db

# Pushing a git tag v-db-<version> (e.g. v-db-v1) builds and pushes $REGISTRY/sso-db:<that tag>.
# Liquibase with the changelog (db/). The registry is ghcr.io/<repository owner> unless the repository variable IMAGE_REGISTRY names another.
on:
  push:
    tags: ["v-db-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag v-db-<version> to build again; the image gets the same tag
        required: true
        type: string

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker-image.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      code: db
      image: sso-db
      dockerfile: Dockerfile
      context: db
