name: image migrator

# Pushing a git tag v-migrator-<version> (e.g. v-migrator-v1) builds and pushes $REGISTRY/sso-db-migrator:<that tag>.
# Sso.DbMigrator prepare | finish. The registry is ghcr.io/<repository owner> unless the repository variable IMAGE_REGISTRY names another.
on:
  push:
    tags: ["v-migrator-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag v-migrator-<version> to build again; the image gets the same tag
        required: true
        type: string

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_docker-image.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      code: migrator
      image: sso-db-migrator
      dockerfile: Dockerfile.db-migrator
      context: .
